# CI: runs automatically on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Lint (pyflakes rules via ruff)
        run: |
          pip install ruff
          ruff check --isolated --select F .

      - name: Engine tests
        run: PYTHONPATH=framework python -m unittest engine.tests.test_engine -v

      - name: Sample product tests (todo-cli)
        working-directory: products/todo-cli
        run: PYTHONPATH=src python -m unittest discover -s tests -v
